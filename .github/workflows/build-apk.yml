# Сборка Android APK и публикация его в GitHub Releases.
#
# Тот же принцип, что у веб-сборки (deploy-web.yml) — ключи OpenRouter
# приходят из секретов репозитория при сборке, не хранятся в исходниках.
# Собранный APK всё равно содержит ключи открытым текстом (клиентское
# приложение секретов не хранит), но их не нужно пересылать вручную
# при каждой сборке — GitHub подставляет их сам.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Толкать релиз может только одна сборка одновременно.
concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # «[no-apk]» в сообщении коммита — обновить только веб, без новой сборки APK.
    if: ${{ !contains(github.event.head_commit.message, '[no-apk]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Постоянный ключ подписи (секреты ANDROID_KEYSTORE_BASE64 и
      # ANDROID_KEYSTORE_PASSWORD) — чтобы новый APK ставился поверх старого.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pusl-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pusl-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — APK подписан временным ключом и не встанет поверх прежнего"
          fi

      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_KEY="${{ secrets.OPENROUTER_KEY }}" \
            --dart-define=OPENROUTER_KEY_2="${{ secrets.OPENROUTER_KEY_2 }}" \
            --dart-define=OPENROUTER_KEY_3="${{ secrets.OPENROUTER_KEY_3 }}" \
            --dart-define=OPENROUTER_KEY_4="${{ secrets.OPENROUTER_KEY_4 }}" \
            --build-name="0.${{ github.run_number }}" \
            --build-number=1000000 \
            --dart-define=APP_VERSION="0.${{ github.run_number }}" \
            --dart-define=GIT_SHA="${{ github.sha }}" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Артефакт сборки — доступен на вкладке Actions у этого запуска,
      # хранится 90 дней. Удобно сразу после пуша, без похода в Releases.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # Стабильная ссылка "последний АПК" — перезаписывает один и тот
      # же релиз-тег при каждой сборке, а не плодит новый релиз на
      # каждый пуш (решение: не нужна история версий, нужен один
      # актуальный файл под рукой).
      # Маленький файл версии рядом с APK: приложение проверяет обновление по прямой
      # ссылке, а не через api.github.com (у API лимит 60 запросов/час на IP — в РФ с
      # общими адресами он быстро кончается, и проверка падала с 403).
      # Версия «0.N»: N растёт на 1 с каждой сборкой. versionCode у всех сборок одинаковый (1000000),
      # поэтому Android разрешает ставить более раннюю сборку поверх более поздней (откат из приложения).
      # versions.json — последние 6 сборок (новые первыми) для списка отката; сами APK лежат в релизах v0.N.
      - name: version.json и versions.json
        env:
          VER: 0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          d=build/app/outputs/flutter-apk
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"sha":"%s","built":"%s","version":"%s"}' "${{ github.sha }}" "$built" "$VER" > $d/version.json
          curl -sfL "https://github.com/$REPO/releases/download/latest-apk/versions.json" -o old.json || echo '[]' > old.json
          python3 - <<PY
          import json
          try:
              old = json.load(open('old.json'))
          except Exception:
              old = []
          new = {"version": "$VER", "sha": "${{ github.sha }}", "built": "$built",
                 "url": "https://github.com/$REPO/releases/download/v$VER/app-release.apk"}
          rows = [new] + [e for e in old if e.get("sha") != new["sha"]]
          json.dump(rows[:6], open('$d/versions.json', 'w'), ensure_ascii=False)
          PY

      # Архивный релиз этой версии (для отката).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Версия 0.${{ github.run_number }}
          body: Автособрано из ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Последняя сборка
          body: Автособрано из ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/version.json
            build/app/outputs/flutter-apk/versions.json

      # Храним только 6 последних архивных релизов.
      - name: Чистка старых версий
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v0\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag -y || true; done
