name = "pusl-calls"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Открытые ключи подписи токенов чат-базы — ими проверяется пользователь.
JWKS_URL = "https://yirvomezybprdlntxyas.supabase.co/auth/v1/.well-known/jwks.json"
# Пробуждение бесплатного проекта Supabase: cron воркера дважды в день,
# чтобы проект не ушёл в паузу после недели без активности.
# anon-ключ публичный — он же лежит в config/chat-config.json.
KEEPALIVE_URL = "https://yirvomezybprdlntxyas.supabase.co"
KEEPALIVE_ANON = "sb_publishable_2nW7G7lKueMQamuFeoC3Cw_iql48Xj3"
# Папка моделей на Google Диске для автоимпорта в R2 (cron 04:00/16:00 UTC).
GDRIVE_MODELS_FOLDER = "1jctM_rUtijeK3ts8lPUfRW5NSzT88VFO"
# Пороги трафика через ретранслятор в месяц — ниже бесплатных объёмов
# (Cloudflare 1000 ГБ, Metered 500 МБ), чтобы не платить никогда.
CF_TURN_LIMIT_GB = "800"
METERED_LIMIT_MB = "450"
# Медиа (фото/файлы чата) в R2: бесплатно 10 ГБ, поэтому держим потолок 8 ГБ
# (2 ГБ запас), на пользователя 1 ГБ в месяц, один объект не больше 25 МБ.
MEDIA_LIMIT_GB = "8"
MEDIA_USER_LIMIT_MB = "1024"
MEDIA_MAX_OBJECT_MB = "25"
# Новостная лента: RSS-источники (через запятую). Обновляется по расписанию,
# поэтому приложение тянет готовый JSON один раз при запуске и не дёргает RSS.
# По указанию владельца 23.11 грузим все новости из всех фидов без серверной
# фильтрации — отбор по источникам и словам делает приложение (NewsFilter).
# 23.11 проверены curl'ом: issf-academy (официальная академия ISSF — живой
# RSS), shootinguk, ammoland, ssusa (NRA Shooting Sports Journal) — 200.
# Мёртвые убраны: issf-sports.org/rss/news.xml — 404, nrablog.com/feed/ — 404,
# thefirearmblog.com/blog/feed/ — 406 (не отдаёт RSS нашему user-agent),
# all4shooters.com/en/rss/ — из нашей сети не отвечает.
NEWS_FEEDS = "https://www.issf-academy.com/feed/,https://www.ssusa.org/rss/,https://www.shootinguk.co.uk/feed/,https://www.olympic.ca/feed/,https://www.espn.com/espn/rss/olympics/news,https://news.google.com/rss/search?q=%D0%BF%D1%83%D0%BB%D0%B5%D0%B2%D0%B0%D1%8F+%D1%81%D1%82%D1%80%D0%B5%D0%BB%D1%8C%D0%B1%D0%B0&hl=ru&gl=RU&ceid=RU:ru,https://news.google.com/rss/search?q=%D1%81%D1%82%D1%80%D0%B5%D0%BB%D1%8C%D0%B1%D0%B0+%D1%81%D0%BF%D0%BE%D1%80%D1%82&hl=ru&gl=RU&ceid=RU:ru,https://news.google.com/rss/search?q=ISSF+shooting&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=Olympic+shooting+sport&hl=en-US&gl=US&ceid=US:en,https://news.google.com/rss/search?q=air+rifle+competition&hl=en-US&gl=US&ceid=US:en"
# NEWS_KEYWORDS больше не используется: по указанию владельца 23.11 сервер
# грузит все новости, фильтрация перенесена в приложение
# (lib/services/news_service.dart, NewsFilter).

# Обновление новостей два раза в сутки: RSS отдаётся в кэш R2, приложение
# читает только наш /news — расход RSS-источников не зависит от числа людей.
[triggers]
crons = ["0 4,16 * * *"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageDO"

# Бесплатный тариф — только Durable Objects на SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "UserDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageDO"]

# Медиа чата: содержимое приходит УЖЕ зашифрованным на устройстве
# (AES-256-GCM), бакет приватный, публичного адреса нет.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nexusbox"

# --- Каталог 3D-моделей BS-Shooting (просьба владельца 23.11) ---
# Файлы лежат в этом же бакете MEDIA по ключам models/<id>/preview.png,
# models/<id>/model.glb, models/<id>/model.stp, models/catalog.json — тела
# зашифрованы AES-256-GCM секретным ключом воркера (nonce(12) | ciphertext+tag).
# Привязка R2 новая НЕ нужна: используем MEDIA выше. Оба секрета ставит
# владелец перед деплоем (npx wrangler secret put <ИМЯ>) и держит в тайне:
#
#   MODELS_KEY — base64 ровно 32 байта (AES-256). Сгенерировать один раз:
#     node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#   MODELS_ADMIN_TOKEN — длинная случайная строка для загрузки/удаления:
#     node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#
# Загрузка (нужна только владельцу): node scripts/upload-model.mjs — см. отчёт.
