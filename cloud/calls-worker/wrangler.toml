name = "pusl-calls"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Открытые ключи подписи токенов чат-базы — ими проверяется пользователь.
JWKS_URL = "https://frbptucrvmyikencyspu.supabase.co/auth/v1/.well-known/jwks.json"
# Пороги трафика через ретранслятор в месяц — ниже бесплатных объёмов
# (Cloudflare 1000 ГБ, Metered 500 МБ), чтобы не платить никогда.
CF_TURN_LIMIT_GB = "800"
METERED_LIMIT_MB = "450"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageDO"

# Бесплатный тариф — только Durable Objects на SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "UserDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageDO"]
