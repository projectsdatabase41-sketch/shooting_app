name: shooting_app
description: Приложение для стрелкового спорта — запись и анализ результатов по мишеням ISSF.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # v3.x грузит нативную библиотеку через Dart build hooks (native
  # assets) вместо ручного DynamicLibrary.open — это единственный
  # способ, который одинаково работает и для `flutter run`, и для
  # `flutter test` на Windows/Linux/macOS. sqlite3_flutter_libs (для
  # версии 2.x) больше не нужен и объявлен устаревшим апстримом.
  sqlite3: ^3.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  http: ^1.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  # Только декодирование/масштабирование фото для детектора пробоин
  # (logic/shot_photo_detection.dart) — чистый Dart, без нативных
  # биндингов и без OpenCV: тот же принцип минимума зависимостей, что и
  # везде в проекте.
  image: ^4.2.0
  # Живая камера для "Фото мишени" — только на Android (см.
  # camera_scan_screen.dart): пакет не поддерживает Windows desktop, там
  # остаётся выбор файла через file_picker.
  camera: ^0.11.0+2
  # Открыть сайт Supabase из формы первого подключения (создать свой
  # проект) — единственное применение, полноценный webview не нужен.
  url_launcher: ^6.3.0
  # Акселерометр для авто-спуска камеры на вебе (camera_web не отдаёт
  # кадры потока — startImageStream там бросает UnimplementedError,
  # поэтому "трясётся ли картинка" там определяется не по пикселям, как
  # на Android, а по датчику движения телефона).
  sensors_plus: ^7.1.0
  # Только для фото профиля в чате — специально ВМЕСТО file_picker:
  # у file_picker выбор изображения идёт через общий системный chooser
  # (ACTION_GET_CONTENT), который на части Android-прошивок предлагает
  # среди прочего и "Камеру" — а снимок камерой Android сохраняет в
  # галерею сам, это стандартное поведение приложения камеры, а не
  # что-то, что можно отключить на стороне file_picker. image_picker
  # открывает системную ГАЛЕРЕЮ напрямую, без промежуточного chooser'а,
  # и лишней копии в галерее не появляется.
  image_picker: ^1.1.2
  # Push-уведомления чата (FCM) — только Android (см. push_service.dart):
  # проект Firebase пока не создан (lib/services/firebase_settings.dart
  # пуст), но зависимости безопасно добавить заранее — без вызова
  # Firebase.initializeApp() они ничего не делают и сборку не трогают.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # "Позвать тренера" (chat_thread_screen.dart) — отдельный канал
  # уведомлений с рингтоном устройства и усиленной вибрацией вместо
  # обычного пинга. Только Android (см. push_service.dart) — тот же
  # принцип минимума зависимостей: пакет, а не свой платформенный канал.
  flutter_local_notifications: ^18.0.1
  # Настоящее цветовое колесо (HSV) для диалога выбора цвета — раньше
  # была самодельная сетка из 64 квадратиков-приближений вместо точного
  # круга, ручной HSV-виджет того же уровня качества смысла не имеет
  # писать самим, когда есть проверенный пакет.
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Только для разовой генерации ярлыка (icon: Pusl) — не рантайм-зависимость.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - lib/db/local_schema.sql

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#37474F"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1a202c"
    theme_color: "#1a202c"
