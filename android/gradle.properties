org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Сборка падала с «Gradle build daemon disappeared unexpectedly»: JVM Gradle
# получал -Xmx8G, а на раннере GitHub 7 ГБ и на ноутбуке память занята другими
# приложениями, поэтому G1 не могла выделить виртуальную память (hs_err:
# "G1 virtual space"). Два гига + один воркер + без демона собирают APK
# стабильно и не держат несколько JVM одновременно.
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
