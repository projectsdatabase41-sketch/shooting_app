<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — Стрельба</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f2f2f5; margin: 0; }
  .card { max-width: 420px; margin: 60px auto; padding: 40px 32px; background: #fff; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; margin: 0 0 16px; color: #1a1a1a; }
  p { font-size: 14px; line-height: 1.5; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
  button { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #93b4f0; cursor: default; }
  .msg { font-size: 14px; margin-top: 12px; }
  .err { color: #c0392b; }
  .ok { color: #22a955; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Новый пароль</h1>
    <p id="hint">Введите новый пароль для входа в чат приложения «Стрельба».</p>
    <input id="password" type="password" placeholder="Новый пароль" autocomplete="new-password">
    <button id="submit">Сохранить пароль</button>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    // Публичный (anon/publishable) ключ отдельного Supabase-проекта чата —
    // не секрет, тот же, что уже зашит в клиенте приложения
    // (lib/services/chat_settings.dart), безопасен для статической страницы.
    var SUPABASE_URL = 'https://frbptucrvmyikencyspu.supabase.co';
    var ANON_KEY = 'sb_publishable_4kAWR6cYksf6cE0Ch13Tpw_nZZjT1M0';

    var params = new URLSearchParams(location.hash.replace('#', '?'));
    var accessToken = params.get('access_token');
    var msg = document.getElementById('msg');
    var submit = document.getElementById('submit');
    var passwordInput = document.getElementById('password');

    if (!accessToken || params.get('type') !== 'recovery') {
      document.getElementById('hint').textContent = 'Ссылка недействительна или устарела — запросите сброс пароля заново в приложении.';
      passwordInput.style.display = 'none';
      submit.style.display = 'none';
    }

    submit.addEventListener('click', async function () {
      var password = passwordInput.value;
      if (password.length < 6) {
        msg.textContent = 'Пароль должен быть не короче 6 символов';
        msg.className = 'msg err';
        return;
      }
      submit.disabled = true;
      msg.textContent = '';
      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'apikey': ANON_KEY,
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password: password })
        });
        if (!res.ok) throw new Error((await res.json()).msg || 'Не удалось сохранить пароль');
        msg.textContent = 'Пароль обновлён — вернитесь в приложение и войдите с новым паролем.';
        msg.className = 'msg ok';
        passwordInput.style.display = 'none';
        submit.style.display = 'none';
      } catch (e) {
        msg.textContent = String(e.message || e);
        msg.className = 'msg err';
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
