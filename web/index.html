<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подставляется при сборке: `flutter build web --base-href /путь/`.
       Для корня сайта достаточно `flutter build web` — будет "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Запись и разбор результатов стрельбы по мишеням ISSF">

  <!-- Масштабирование пальцами отключено намеренно: на экране мишени
       свои жесты — щипок меняет зум самой мишени, долгое нажатие
       ставит пробоину. Если Safari будет одновременно зумить страницу,
       не работать будет ни то, ни другое. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS: приложение с домашнего экрана, без адресной строки Safari.
       Без этих трёх строк ярлык открывается обычной вкладкой. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Стрельба">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a202c">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Стрельба</title>

  <style>
    /* Пока грузится canvaskit, экран не должен быть белым: на телефоне
       это выглядит как зависший браузер. Загрузка веб-версии заметно
       дольше нативной (движок рендеринга + весь код одним файлом) —
       анимация здесь не ускоряет саму загрузку, только не даёт экрану
       выглядеть зависшим на время ожидания. */
    html, body { margin: 0; padding: 0; height: 100%; background: #1a202c; overscroll-behavior: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      color: #8894a6; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading .target {
      position: relative; width: 64px; height: 64px;
    }
    #loading .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #3D6BF2;
      animation: spin 1s linear infinite;
    }
    #loading .ring:nth-child(2) {
      inset: 10px;
      border-top-color: #d9633b;
      animation-duration: 0.75s;
      animation-direction: reverse;
    }
    #loading .ring:nth-child(3) {
      inset: 20px;
      border-top-color: #8894a6;
      animation-duration: 1.4s;
    }
    #loading .dot {
      position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      margin: -3px; border-radius: 50%; background: #e8ecf3;
    }
    #loading span { opacity: 0.85; letter-spacing: 0.02em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading.fade-out { animation: fade-out 0.25s ease forwards; }
    @keyframes fade-out { to { opacity: 0; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="target">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="dot"></div>
    </div>
    <span>Загрузка…</span>
  </div>
  <script>
    // Убираем заглушку, как только Flutter отрисовал первый кадр —
    // короткое затухание вместо мгновенного скачка, чтобы переход не
    // выглядел рывком.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade-out');
      el.addEventListener('animationend', function () { el.remove(); });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
