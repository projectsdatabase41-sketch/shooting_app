<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подставляется при сборке: `flutter build web --base-href /путь/`.
       Для корня сайта достаточно `flutter build web` — будет "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Запись и разбор результатов стрельбы по мишеням ISSF">

  <!-- Масштабирование пальцами отключено намеренно: на экране мишени
       свои жесты — щипок меняет зум самой мишени, долгое нажатие
       ставит пробоину. Если Safari будет одновременно зумить страницу,
       не работать будет ни то, ни другое. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS: приложение с домашнего экрана, без адресной строки Safari.
       Без этих трёх строк ярлык открывается обычной вкладкой. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Стрельба">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a202c">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Стрельба</title>

  <style>
    /* Пока грузится canvaskit, экран не должен быть белым: на телефоне
       это выглядит как зависший браузер. */
    html, body { margin: 0; padding: 0; height: 100%; background: #1a202c; overscroll-behavior: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8894a6; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Загрузка…</div>
  <script>
    // Убираем заглушку, как только Flutter отрисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
