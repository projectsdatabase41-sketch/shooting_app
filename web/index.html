<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подставляется при сборке: `flutter build web --base-href /путь/`.
       Для корня сайта достаточно `flutter build web` — будет "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Запись и разбор результатов стрельбы по мишеням ISSF">

  <!-- Масштабирование пальцами отключено намеренно: на экране мишени
       свои жесты — щипок меняет зум самой мишени, долгое нажатие
       ставит пробоину. Если Safari будет одновременно зумить страницу,
       не работать будет ни то, ни другое. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS: приложение с домашнего экрана, без адресной строки Safari.
       Без этих трёх строк ярлык открывается обычной вкладкой. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a202c">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Nexus</title>

  <style>
    /* Заставка = видео. Оно играет сразу, пока под ним грузится движок и код
       приложения, и прячет сам процесс загрузки (раньше показывались ярлык,
       крутилка и только потом видео). Фон чисто чёрный — как у видео, шва нет. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overscroll-behavior: none; }
    /* iOS Safari: страница не должна прокручиваться и сворачивать адресную
       строку — при смене высоты окна касания Flutter сдвигаются относительно
       кнопок («нажимаю выше кнопки»). Фиксируем окно и отключаем двойной тап. */
    html, body { position: fixed; inset: 0; width: 100%; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #loading { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    #loading img { width: 100%; height: 100%; object-fit: contain; }
    @media (prefers-color-scheme: light) { html, body, #loading { background: #f4f6f8; } }
    /* Запасная крутилка — только если видео не запустилось. */
    #loading .target { position: absolute; width: 64px; height: 64px; }
    #loading .target[hidden] { display: none; }
    #loading .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #3D6BF2; animation: spin 1s linear infinite; }
    #loading .ring:nth-child(2) { inset: 10px; border-top-color: #d9633b; animation-duration: 0.75s; animation-direction: reverse; }
    #loading .ring:nth-child(3) { inset: 20px; border-top-color: #8894a6; animation-duration: 1.4s; }
    #loading .dot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #e8ecf3; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading.fade-out { animation: fade-out 0.35s ease forwards; pointer-events: none; }
    @keyframes fade-out { to { opacity: 0; } }
  </style>
</head>
<body>
  <div id="loading">
    <picture>
      <source srcset="assets/assets/bg/web/launch_light.webp" media="(prefers-color-scheme: light)">
      <img id="launchImg" alt="" src="assets/assets/bg/web/launch_dark.webp">
    </picture>
  </div>
  <script>
    // Статичная заставка (видео в вебе подтормаживало): картинка сразу, исчезает,
    // как только Flutter нарисовал первый кадр. Страховка — 15 с.
    (function () {
      var el = document.getElementById('loading'), done = false;
      function hide() {
        if (done || !el) return;
        done = true;
        el.classList.add('fade-out');
        el.addEventListener('animationend', function () { el.remove(); });
        setTimeout(function () { el.remove(); }, 700);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 15000);
    })();
  </script>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-messaging-compat.js"></script>
  <script src="push-bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
